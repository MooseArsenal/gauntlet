<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gauntlet — Join</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Public+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="strip"><span>Exercise control · Join an exercise</span><span>Facilitated exercise — no production access — all actions are simulated</span></div>
  <header class="bar">
    <div class="brand"><span class="mark"><span>G</span></span><b>Gauntlet</b><small>Join an exercise</small></div>
    <div class="bar-actions">
      <a class="btn ghost" href="/">Console</a>
      <button class="btn toggle" id="btnTheme" aria-label="Toggle theme">◑</button>
    </div>
  </header>

  <main class="empty">
    <div class="empty-card">
      <p class="eyebrow">Join code</p>
      <h1>Join the exercise</h1>
      <p class="sub">Enter the code your facilitator shared, choose your side, and you're in.</p>
      <div class="setup">
        <label>Join code
          <input id="joinCode" type="text" inputmode="latin" autocapitalize="characters"
                 maxlength="6" placeholder="ABC123" style="text-transform:uppercase;letter-spacing:.2em;font-family:'IBM Plex Mono',monospace">
        </label>
        <label>Your side
          <select id="joinCell">
            <option value="blue_cell">🛡️ Blue cell (defender)</option>
            <option value="red_cell">🗡️ Red cell (adversary)</option>
            <option value="white_cell">⚪ White cell (observer)</option>
          </select>
        </label>
        <label>Display name <span class="hint">(optional)</span>
          <input id="joinName" type="text" placeholder="e.g. SOC analyst 2">
        </label>
        <button class="btn primary" id="btnJoin">Join →</button>
        <p class="loginerr" id="joinErr" hidden></p>
      </div>
    </div>
  </main>

  <div class="toast" id="toast" hidden></div>
  <script src="/join.js"></script>
</body>
</html>
