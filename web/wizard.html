<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gauntlet — Guided</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Public+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/wizard.css">
</head>
<body>
  <div class="strip"><span>Exercise control · Guided build</span><span>Facilitated exercise — no production access — all actions are simulated</span></div>
  <header class="bar">
    <div class="brand"><span class="mark"><span>G</span></span><b>Gauntlet</b><small>Guided</small></div>
    <div class="bar-mid"><span class="wz-crumbs" id="crumbs"></span></div>
    <div class="bar-actions">
      <a class="btn ghost small" href="/index.html">Console</a>
      <a class="btn ghost small" href="/editor.html">Editor</a>
      <button class="btn ghost small" id="btnTheme" aria-label="Toggle theme">◑</button>
    </div>
  </header>

  <main class="wz">
    <!-- Launcher -->
    <section class="wz-step" id="launcher">
      <p class="eyebrow">What would you like to do?</p>
      <div class="wz-cards">
        <button class="wz-card" data-flow="build">
          <span class="wz-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20l6-6"/><path d="M14 4l6 6-8 8-6-6z"/><path d="M15 9l-1 1"/></svg></span><h3>Build an exercise</h3>
          <p>Pick a scenario type, ground it in your environment, and generate a ready-to-run drill.</p>
        </button>
        <button class="wz-card" data-flow="run">
          <span class="wz-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M10 8.5v7l5.5-3.5z"/></svg></span><h3>Run a session</h3>
          <p>Take an existing scenario live — tabletop, functional, or real-time.</p>
        </button>
        <button class="wz-card" data-flow="report">
          <span class="wz-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3h7l5 5v13H7z"/><path d="M14 3v5h5"/><path d="M9.5 13h6M9.5 17h6"/></svg></span><h3>Report &amp; evidence</h3>
          <p>Turn a finished exercise into audience reports and compliance evidence.</p>
        </button>
      </div>
      <p class="hint">Prefer full control? Open the <a href="/editor.html">visual editor</a> or the <a href="/index.html">console</a> any time.</p>
    </section>

    <!-- Step host (built dynamically) -->
    <section class="wz-step" id="stepHost" hidden>
      <div class="wz-dots" id="dots"></div>
      <div id="stepBody"></div>
      <div class="wz-nav">
        <button class="btn ghost" id="btnBack">Back</button>
        <div class="wz-spacer"></div>
        <a class="btn ghost small" id="advLink" hidden></a>
        <button class="btn primary" id="btnNext">Next</button>
      </div>
    </section>
  </main>

  <div class="toast" id="toast" hidden></div>
  <script src="/brand.js"></script>
  <script src="/progressmap.js"></script>
  <script src="/wizard.js"></script>
</body>
</html>
