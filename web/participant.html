<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gauntlet — Participant View</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Public+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="strip"><span>Exercise control · Participant view</span><span>Facilitated exercise — no production access — all actions are simulated</span></div>
  <header class="bar">
    <div class="brand">
      <span class="mark"><span>G</span></span>
      <b>Gauntlet</b><small>Participant View</small>
    </div>
    <div class="bar-actions">
      <span class="pill" id="livePill" title="Live connection">live</span>
      <a class="btn ghost" href="/">Console</a>
      <button class="btn toggle" id="btnTheme" aria-label="Toggle theme">◑</button>
    </div>
  </header>

  <div class="subbar">
    <label>Session <select id="sessionSel"></select></label>
    <label>Your cell <select id="cellSel"></select></label>
  </div>

  <main class="companion" id="app">
    <section class="stage">
      <div class="panel cell-scene" id="scenePanel">
        <p class="eyebrow">What you've been told</p>
        <div id="scene"><p class="muted">Pick a session to join.</p></div>
        <div class="dc" id="decision" hidden></div>
        <div class="dc" id="attendance" hidden></div>
      </div>
    </section>
    <aside class="side">
      <div class="panel timeline-panel">
        <p class="eyebrow">Your feed <span class="hint">updates live</span></p>
        <ol class="timeline" id="feed"></ol>
      </div>
    </aside>
  </main>

  <div class="toast" id="toast" hidden></div>
  <script src="/brand.js"></script>
  <script src="/participant.js"></script>
</body>
</html>
