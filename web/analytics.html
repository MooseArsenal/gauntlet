<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gauntlet — Maturity</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Public+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="strip"><span>Exercise control · Maturity</span><span>Facilitated exercise — no production access — all actions are simulated</span></div>
  <header class="bar">
    <div class="brand"><span class="mark"><span>G</span></span><b>Gauntlet</b><small>Maturity</small></div>
    <div class="bar-actions">
      <a class="btn ghost" href="/">Console</a>
      <button class="btn toggle" id="btnTheme" aria-label="Toggle theme">◑</button>
    </div>
  </header>

  <main class="mat">
    <p class="eyebrow">Readiness over time</p>
    <h1 style="font-size:1.6rem;margin:.1rem 0 .3rem">Program maturity</h1>
    <p class="muted" id="matLead">Loading…</p>

    <div class="score-tiles mat-tiles" id="matTiles"></div>

    <div class="panel mat-chart" id="chartPanel" hidden>
      <p class="eyebrow">Detection rate over exercises</p>
      <div id="chart"></div>
    </div>

    <div class="panel" id="benchPanel" hidden>
      <p class="eyebrow">Against the sector <span class="hint" id="benchNote"></span></p>
      <div class="mat-table" id="benchTable"></div>
      <div class="row" id="benchOpt" hidden style="margin-top:.6rem">
        <label style="display:flex;align-items:center;gap:.5rem;margin:0"><input type="checkbox" id="benchOptIn"> Contribute this organisation's figures to the instance cohort and see it in return</label>
      </div>
    </div>

    <div class="panel" id="tablePanel" hidden>
      <p class="eyebrow">Per-exercise</p>
      <div class="mat-table" id="matTable"></div>
    </div>
  </main>

  <div class="toast" id="toast" hidden></div>
  <script src="/brand.js"></script>
  <script src="/analytics.js"></script>
</body>
</html>
