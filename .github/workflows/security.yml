# SAST, supply-chain, and secret scanning. Report-only for now
# bandit and pip-audit block (they are clean); gitleaks stays report-only so a
# test fixture cannot fail the build — review its findings in the job log
# once the baseline is clean.
#
# Note: GitHub CodeQL is intentionally NOT used here — code scanning requires
# GitHub Advanced Security, which private repositories don't have. Bandit gives
# Python SAST that runs anywhere. Enable CodeQL if this repo goes public or GHAS
# is turned on.
name: Security

on:
  push:
    branches: [main]
  pull_request:

jobs:
  sast:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install bandit
        run: pip install "bandit>=1.7"
      - name: Bandit SAST
        run: bandit -r app -ll

  dependency-audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pip-audit
        run: pip install pip-audit
      - name: Audit dependencies
        run: pip-audit -r requirements.txt --desc

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks (report-only)
        continue-on-error: true
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Software bill of materials (M5): CycloneDX JSON from the pinned lockfile,
  # attached to every run so a buyer's supply-chain review has the artifact.
  sbom:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install cyclonedx-bom
        run: pip install "cyclonedx-bom>=4.0"
      - name: Generate SBOM (CycloneDX)
        run: cyclonedx-py requirements requirements.lock.txt --of JSON -o sbom.cdx.json
      - name: Sanity-check SBOM
        run: python -c "import json; d=json.load(open('sbom.cdx.json')); print(d['bomFormat'], d['specVersion'], len(d.get('components', [])), 'components')"
      - uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx
          path: backend/sbom.cdx.json
