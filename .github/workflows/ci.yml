# CI: test suite, migration/model lock-step, JavaScript syntax, and a real
# browser smoke of the console. Zero infrastructure — SQLite only.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest -q --ignore=tests/e2e

      - name: Migrations apply cleanly on a fresh database
        env:
          GAUNTLET_DB_URL: sqlite:///./ci.db
        run: |
          rm -f ci.db
          alembic upgrade head

      - name: No undeclared model/migration drift
        env:
          GAUNTLET_DB_URL: sqlite:///./ci.db
        run: alembic check

  web:
    # The console ships as plain JavaScript with no build step, so a syntax
    # error would otherwise reach main unnoticed (F-8).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: JavaScript syntax
        run: for f in web/*.js; do node --check "$f"; done

  browser-smoke:
    # Boots the app and drives the console in headless Chromium: sign in,
    # pick the seeded scenario, start an exercise, see the first inject (F-8).
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies + Playwright
        run: |
          pip install -r requirements.txt playwright
          python -m playwright install --with-deps chromium
      - name: Browser smoke
        run: pytest -q tests/e2e
