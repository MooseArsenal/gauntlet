# CI: run the test suite and prove the Alembic migrations match the models
# (no undeclared schema drift). Zero infrastructure — SQLite only.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest -q

      - name: Migrations apply cleanly on a fresh database
        env:
          GAUNTLET_DB_URL: sqlite:///./ci.db
        run: |
          rm -f ci.db
          alembic upgrade head

      - name: No undeclared model/migration drift
        env:
          GAUNTLET_DB_URL: sqlite:///./ci.db
        run: alembic check
