# Gauntlet with Postgres. Copy .env.example to .env and set at least
# GAUNTLET_SECRET_KEY (and POSTGRES_PASSWORD) before `docker compose up -d`.
services:
  app:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      GAUNTLET_DB_URL: postgresql+psycopg://gauntlet:${POSTGRES_PASSWORD:-change-me}@db:5432/gauntlet
      GAUNTLET_TRUST_PROXY: "1"
    ports:
      - "${GAUNTLET_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - gauntlet-data:/srv/gauntlet/data

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: gauntlet
      POSTGRES_USER: gauntlet
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gauntlet -d gauntlet"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - gauntlet-pg:/var/lib/postgresql/data

volumes:
  gauntlet-data:
  gauntlet-pg:
